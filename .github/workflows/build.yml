name: Build Not Engine

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Linux / ${{ matrix.preset }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        preset:
          - ninja-debug
          - ninja-release
          - ninja-multi
          - make-debug
          - make-release

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            cmake \
            ninja-build \
            libglfw3-dev \
            build-essential

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        if: matrix.preset == 'ninja-debug'
        run: |
          cmake --build --preset ninja-debug-notengine
          cmake --build --preset ninja-debug-all

      - name: Build
        if: matrix.preset == 'ninja-release'
        run: |
          cmake --build --preset ninja-release-notengine
          cmake --build --preset ninja-release-all

      - name: Build
        if: matrix.preset == 'ninja-multi'
        run: |
          cmake --build --preset ninja-multi-debug-notengine
          cmake --build --preset ninja-multi-debug-all
          cmake --build --preset ninja-multi-release-notengine
          cmake --build --preset ninja-multi-release-all

      - name: Build
        if: matrix.preset == 'make-debug'
        run: |
          cmake --build --preset make-debug-notengine
          cmake --build --preset make-debug-all

      - name: Build
        if: matrix.preset == 'make-release'
        run: |
          cmake --build --preset make-release-notengine
          cmake --build --preset make-release-all

  windows-vs2022:
    name: Windows / VS2022
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install GLFW
        shell: pwsh
        run: |
          vcpkg install glfw3:x64-windows

      - name: Configure
        run: >
          cmake --preset vs2022
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build Debug
        run: |
          cmake --build --preset vs2022-debug-notengine
          cmake --build --preset vs2022-debug-all

      - name: Build Release
        run: |
          cmake --build --preset vs2022-release-notengine
          cmake --build --preset vs2022-release-all

  windows-vs2026:
    name: Windows / VS2026
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install GLFW
        shell: pwsh
        run: |
          vcpkg install glfw3:x64-windows

      - name: Configure
        run: >
          cmake --preset vs2026
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build Debug
        run: |
          cmake --build --preset vs2026-debug-notengine
          cmake --build --preset vs2026-debug-all

      - name: Build Release
        run: |
          cmake --build --preset vs2026-release-notengine
          cmake --build --preset vs2026-release-all