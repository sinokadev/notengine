name: Unit tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Linux / ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        preset: [unit-debug, unit-release]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential libglfw3-dev libglm-dev libgl1-mesa-dev
      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DNOTENGINE_FETCH_DEPENDENCIES=OFF
      - name: Build unit tests
        run: cmake --build --preset ${{ matrix.preset }} --parallel 2
      - name: Run unit tests without a display
        run: env -u DISPLAY -u WAYLAND_DISPLAY ctest --preset ${{ matrix.preset }}
